# ASR systems evaluated. Each table is one system. Keys other than backend, model,
# language and exclude_splits are passed to the backend.
# Hugging Face models are pinned to a revision. The settings used are recorded
# next to the transcripts in results/transcripts/<dataset>/<system>.meta.json.

[whisper-small]
backend = "whisper"
model = "openai/whisper-small"
revision = "973afd24965f72e36ca33b3055d56a652f456b4d"
language = "hi"

[whisper-medium]
backend = "whisper"
model = "openai/whisper-medium"
revision = "abdf7c39ab9d0397620ccaea8974cc764cd0953e"
language = "hi"

[whisper-large-v3]
backend = "whisper"
model = "openai/whisper-large-v3"
revision = "06f233fe06e710322aca913c1bc4249a0d71fce1"
language = "hi"

[whisper-large-v3-turbo]
backend = "whisper"
model = "openai/whisper-large-v3-turbo"
revision = "41f01f3fe87f28c78e2fbf8b568835947dd65ed9"
language = "hi"

# Trained partly on FLEURS train, so never scored on that split.
[mms-1b-all]
backend = "ctc"
model = "facebook/mms-1b-all"
revision = "3d33597edbdaaba14a8e858e2c8caa76e3cec0cd"
language = "hi"
adapter = "hin"
exclude_splits = ["train"]

# Same model, two output conventions: digits versus numbers as spoken.
[saaras-v4-transcribe]
backend = "sarvam"
model = "saaras:v4"
mode = "transcribe"
language = "hi-IN"

[saaras-v4-verbatim]
backend = "sarvam"
model = "saaras:v4"
mode = "verbatim"
language = "hi-IN"
