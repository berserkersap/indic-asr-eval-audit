[mms-tts]
engine = "mms"
model = "facebook/mms-tts-hin"
revision = "1d83b223ec78e30b944f7d96bd117eb3d7023303"
seeds = [0, 1, 2]

# Sarvam's hosted model. Needs SARVAM_API_KEY; costs credits.
[bulbul]
