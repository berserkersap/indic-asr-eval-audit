[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "indic-asr-eval-audit"
dynamic = ["version"]
description = "Auditing how Indic ASR is evaluated: number-aware metrics and synthetic-vs-real test sets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sai" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core: text normalisation, metrics and analysis. Runs on CPU without torch.
dependencies = [
    "jiwer>=4.0",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Install a CUDA build of torch first; see README.
asr = [
    "accelerate>=1.0",
    "huggingface-hub>=0.26",
    "sarvamai>=0.1.40",
    "soundfile>=0.13",
    "torch>=2.6",
    "transformers>=4.56",
]
synth = [
    "langgraph>=1.0",
    "sarvamai>=0.1.40",
    "soundfile>=0.13",
]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.17",
]

[project.scripts]
asr-audit = "indic_asr_audit.cli:main"

[project.urls]
Repository = "https://github.com/berserkersap/indic-asr-eval-audit"
Issues = "https://github.com/berserkersap/indic-asr-eval-audit/issues"

[tool.hatch.version]
path = "src/indic_asr_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/indic_asr_audit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "D",
    "PT", "C4", "T20", "RET", "PIE", "ARG",
]
ignore = [
    "D100", "D104", "D105", "D107",  # module/package/magic/__init__ docstrings are optional
    "RUF001", "RUF002", "RUF003",    # Devanagari text is intentional
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/indic_asr_audit/cli.py" = ["T201"]  # the CLI reports to stdout

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["jiwer.*", "scipy.*", "soundfile.*", "transformers.*", "sarvamai.*", "huggingface_hub.*"]
ignore_missing_imports = true

# Third-party ML stacks are large and loosely typed; do not type-check their internals.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --strict-config"
# langsmith registers a pytest plugin that warns on Python 3.14.
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
